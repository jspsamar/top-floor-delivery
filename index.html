<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Floor Delivery</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="hud" class="hidden">
      <div>Height: <b id="hud-height">0.0</b> m</div>
      <div>Time: <b id="hud-time">0:00.0</b></div>
      <div>Best: <b id="hud-best">0.0</b> m</div>
    </div>
    <div id="help" class="hidden">Mouse = reach &nbsp;•&nbsp; Hold LEFT / RIGHT click = grab with left / right hand &nbsp;•&nbsp; R = restart</div>
    <div id="overlay">
      <div id="overlay-content">
        <h1>Top Floor Delivery</h1>
        <p class="sub">The elevator is broken. The penthouse wants its pizza.</p>
        <p class="blink">Click to start</p>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
